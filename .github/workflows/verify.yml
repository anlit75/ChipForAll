name: RTL to GDSII

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore here, deliberately. A required status check that never runs
  # is not "skipped", it is "Expected -- waiting for status to be reported", and
  # the pull request can never be merged. A docs-only change costs one full run;
  # a permanently unmergeable pull request costs more. The push trigger above
  # keeps its filter, so merging docs to main still skips the flow.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # The Dev Container is the "zero install" promise, and nothing else here
  # exercises it -- the job below runs on the host, against the plain image.
  # So a devcontainer.json change could only be caught by opening a Codespace
  # by hand, which is how `remoteUser` broke once already.
  #
  # Builds it for real and checks the two things `make gds` needs from it: a
  # Docker daemon that answers (the guard's exact condition), and the
  # in-container delegation path the Makefile takes when it finds the
  # entrypoint script locally. It does not run `make gds` itself -- that wants
  # a 3GB PDK and twenty minutes -- and it cannot speak for Codespaces, whose
  # remote server is a different thing again.
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the Dev Container and use it
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -e
            echo "--- the daemon 'make gds' guards on ---"
            docker info > /dev/null
            docker version --format '{{.Server.Version}}'
            echo "--- the in-container delegation path ---"
            make lint

  full-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read  # only to ask whether Pages is on; see the results page steps
    outputs:
      publish-pages: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      # --- PERFORMANCE OPTIMIZATION ---
      # Cache the ~3GB Sky130 PDK to save CI time and bandwidth.
      # Volare will automatically skip downloading if the target hash exists in this cached directory.
      - name: Cache Sky130 PDK
        id: cache-pdk
        uses: actions/cache@v5
        with:
          path: pdks
          key: sky130-pdk-${{ runner.os }}-v1
          restore-keys: |
            sky130-pdk-${{ runner.os }}-

      # c4o-core's version tag is repeated three times because nothing here
      # reads it from a single source: the Makefile drives `make gds`, this
      # workflow pulls the image before the Makefile ever runs, and
      # devcontainer.json is read by an external tool that never touches the
      # Makefile at all. A tag bumped in one place and missed in another does
      # not fail loudly -- it just means whoever builds locally, opens the
      # Codespace, or runs this workflow silently gets a different c4o-core
      # than everyone else. Runs before the pull below so a mismatch is
      # caught as a config error, not paid for as a wasted image pull.
      - name: Verify c4o-core image version is pinned consistently
        run: |
          python3 -c "
          import json, os, re, sys

          def read(path):
              # A file that is not here is a file somebody removed on purpose --
              # dropping .devcontainer/ is a reasonable thing to do with a
              # template. Only the pins that are still here have to agree.
              return open(path).read() if os.path.exists(path) else None

          def matched(pattern, text):
              m = re.search(pattern, text, re.M)
              return m.group(1) if m else None

          values = {}

          makefile = read('Makefile')
          if makefile is not None:
              values['Makefile'] = matched(r'^C4O_IMAGE\s*:=\s*(\S+)', makefile)

          workflow = read('.github/workflows/verify.yml')
          if workflow is not None:
              values['.github/workflows/verify.yml'] = matched(
                  r'docker pull (ghcr\.io/\S+/c4o-core:\S+)', workflow)

          devcontainer = read('.devcontainer/devcontainer.json')
          if devcontainer is not None:
              # devcontainer.json is JSONC; strip the line comments first.
              stripped = re.sub(r'^\s*//.*\$', '', devcontainer, flags=re.M)
              values['.devcontainer/devcontainer.json'] = json.loads(stripped).get('image')

          # Present but unreadable means this step went stale, not that the pins
          # disagree. Name the file rather than leaving a traceback nothing
          # points anyone at.
          for path, value in values.items():
              if value is None:
                  print(path + ': found no c4o-core image reference.')
                  print('If you renamed or moved it, this step has to be updated too.')
                  sys.exit(1)

          if len(set(values.values())) > 1:
              print('c4o-core image reference is inconsistent:')
              for path in values:
                  print('  ' + path + ': ' + values[path])
              sys.exit(1)
          print('c4o-core image reference is consistent: ' + next(iter(values.values())))
          "

      - name: Pull c4o-core Image
        run: docker pull ghcr.io/anlit75/c4o-core:2.11

      # The devcontainer runs as a named user so that files it creates on a
      # Linux host stay owned by the host user. That user comes from the base
      # image rather than from our Dockerfile, so assert it is really there --
      # otherwise a future c4o-core rebuild breaks the devcontainer silently,
      # in a way no other step here would catch.
      - name: Verify the devcontainer user exists in its image
        run: |
          # devcontainer.json is JSONC, so strip line comments before parsing.
          set -- $(python3 -c "
          import json, re
          src = open('.devcontainer/devcontainer.json').read()
          d = json.loads(re.sub(r'^\s*//.*$', '', src, flags=re.M))
          print(d['image'], d['remoteUser'])
          ")
          echo "image=$1 remoteUser=$2"
          docker run --rm --entrypoint id "$1" -u "$2"

      # README tells anyone on an Apple Silicon machine that `make gds` runs
      # native because LibreLane publishes arm64, and that is a fact about
      # somebody else's registry: if they stop publishing it, or the pinned tag
      # moves, that paragraph is wrong with nothing failing. Ask the registry.
      # No arm64 runner needed -- a manifest index lists its platforms.
      - name: The arm64 image the README promises is still published
        run: |
          image=$(grep -E '^LIBRELANE_IMAGE :=' Makefile | sed 's/.*:= *//')
          repo=${image%:*}; repo=${repo#ghcr.io/}; tag=${image##*:}
          token=$(curl -sS "https://ghcr.io/token?scope=repository:$repo:pull&service=ghcr.io" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          platforms=$(curl -sS -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$tag" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for m in d.get('manifests', []):
              p = m.get('platform', {})
              print(p.get('os', '?') + '/' + p.get('architecture', '?'))
          ")
          echo "$image publishes:"
          echo "${platforms:-  (a single manifest, no platform list)}"
          if ! grep -qx 'linux/arm64' <<<"$platforms"; then
            echo "::error::README says make gds runs native on arm64 because $image is published for it. It is not."
            exit 1
          fi

      # README tells a reader that SystemVerilog works in every command from
      # c4o-core 2.8.3 on. `make sim` is the one that used to reject it, so run
      # the pinned image against a file that needs it. Written by this step
      # rather than shipped into the template: the claim is about the image, not
      # about the example, and the template stays a Verilog one.
      - name: SystemVerilog reads, as the README says it does
        run: |
          image=$(grep -E '^C4O_IMAGE :=' Makefile | sed 's/.*:= *//')
          work=$(mktemp -d)
          python3 - "$work" <<'PY'
          import os, sys, textwrap
          work = sys.argv[1]
          os.makedirs(f"{work}/src", exist_ok=True)
          os.makedirs(f"{work}/test", exist_ok=True)
          open(f"{work}/src/sv.sv", "w").write(textwrap.dedent("""\
              module sv (input logic clk, input logic rst, output logic q);
                always_ff @(posedge clk or posedge rst) q <= rst ? 1'b0 : ~q;
              endmodule
              """))
          open(f"{work}/test/sv_tb.v", "w").write(textwrap.dedent("""\
              `timescale 1ns/1ps
              module sv_tb;
                reg clk = 0, rst = 1; wire q;
                sv dut (.clk(clk), .rst(rst), .q(q));
                always #5 clk = ~clk;
                initial begin #12 rst = 0; #40 $display("ok q=%b", q); $finish; end
              endmodule
              """))
          open(f"{work}/config.yaml", "w").write(textwrap.dedent("""\
              DESIGN_NAME: sv
              VERILOG_FILES:
                - dir::src/sv.sv
              "//TEST_FILES":
                - dir::test/sv_tb.v
              """))
          PY
          docker run --rm -v "$work:/workspace" -w /workspace \
            -u "$(id -u):$(id -g)" "$image" sim
          echo "  sim accepted always_ff and logic"

      - name: 1. Lint Check
        run: make lint

      - name: 2. Simulation
        run: make sim

      # Cheap -- the tests run in well under a second -- so unlike the
      # gate-level step below, this one runs on pull requests too.
      #
      # Skipped when config.yaml does not ask for Python testbenches. This is
      # a template: somebody putting their own design in it may only want
      # Verilog tests, and a starter kit whose CI goes red for a test kind you
      # never opted into is a starter kit you abandon. The key's presence is
      # the opt-in; if it IS there and matches no files, `make cocotb` fails,
      # which is correct -- you asked for something that is not there.
      - name: 2b. cocotb Tests
        run: |
          if ! grep -q '^"//COCOTB_TESTS":' config.yaml; then
            echo "config.yaml has no //COCOTB_TESTS -- no Python testbenches to run."
            exit 0
          fi
          make cocotb

      # The cocotb verdicts as a table on the run's summary page, instead of
      # only in the log. always() so a failing test is shown too -- that is
      # when the table is worth opening. Gated on the file, not on the
      # //COCOTB_TESTS key: a run that crashed before writing it has nothing to
      # show, and the step above has already gone red for it.
      - name: cocotb results on the summary page
        if: always() && hashFiles('build/cocotb-results.xml') != ''
        uses: test-summary/action@v2
        with:
          paths: build/cocotb-results.xml

      - name: 3. Logic Synthesis
        run: make synth

      # Cheap, like the cocotb step: yosys stops after proc and opt, so this
      # is under a second even though `make gds` below is three minutes.
      - name: 3b. Schematic
        run: |
          make schematic
          ls -lh build/schematic.svg
          grep -qF "<svg" build/schematic.svg || { echo "not an SVG"; exit 1; }

      - name: 4. Physical Design (GDSII)
        # This step will automatically trigger 'make pdk' first
        run: make gds

      # docs/guide.md tells a reader they can bring their own timing constraints
      # by setting PNR_SDC_FILE and SIGNOFF_SDC_FILE. Those are LibreLane's
      # variables, not this repository's -- nothing here would notice if an
      # upgrade renamed or dropped them, and the guide would go on telling
      # people to set keys that do nothing. So ask the pinned image itself. This
      # asserts the keys exist, not that a given SDC file is read; only a run
      # with one in it can say that.
      - name: The SDC keys the guide documents exist in this LibreLane
        run: |
          image=$(grep -E '^LIBRELANE_IMAGE :=' Makefile | sed 's/.*:= *//')
          echo "Asking $image which SDC variables it declares:"
          declared=$(docker run --rm "$image" python3 -c "
          import librelane, pathlib
          src = (pathlib.Path(librelane.__file__).parent / 'steps' / 'openroad.py').read_text()
          for key in ('PNR_SDC_FILE', 'SIGNOFF_SDC_FILE'):
              if '\"%s\"' % key in src:
                  print(key)
          ")
          for key in PNR_SDC_FILE SIGNOFF_SDC_FILE; do
            if ! grep -qx "$key" <<<"$declared"; then
              echo "Error: docs/guide.md documents $key, and $image does not declare it."
              echo "What it does declare:"
              echo "${declared:-(nothing)}"
              exit 1
            fi
            echo "  $key ok"
          done

      # Matched rather than named. `make gds` names its output after DESIGN_NAME
      # in config.yaml, so hardcoding "blinky" meant the first thing anyone does
      # with this template -- put their own design in it -- broke CI, on a line
      # nothing points them at.
      - name: Verify GDS Output
        run: |
          shopt -s nullglob
          gds=(build/*.gds)
          if [ ${#gds[@]} -eq 0 ]; then
            echo "Error: make gds produced no .gds in build/"
            exit 1
          fi
          for f in "${gds[@]}"; do
            [ -s "$f" ] || { echo "Error: $f is empty"; exit 1; }
          done
          ls -lh "${gds[@]}"

      # The render is what `report`'s layout row points at and what the
      # artifact step below uploads. Both degrade to silence when it is
      # missing: if-no-files-found stays on 'warn' so that a failed `make gds`
      # does not produce a second, misleading red step -- which also means an
      # upload of nothing would look green. So assert it here instead, where
      # `make gds` has just succeeded and a missing render is a real problem.
      - name: Verify the layout render exists
        run: |
          shopt -s nullglob
          png=(runs/*/final/render/*.png)
          if [ ${#png[@]} -eq 0 ]; then
            echo "Error: the flow drew no layout render under runs/*/final/render/"
            exit 1
          fi
          ls -lh "${png[@]}"

      # docs/guide.zh-TW.md tells a reader with negative slack to cat this exact
      # glob. The path it used to give -- runs/*/final/*.rpt -- matched nothing,
      # and the reader who needed it most got silence back. A documented path
      # that nothing checks is a path that rots, so check it here.
      - name: The timing report the guide tells you to read is where it says
        run: |
          shopt -s nullglob
          rpts=(runs/*/*-openroad-stapostpnr/*ss_*/checks.rpt)
          if [ ${#rpts[@]} -eq 0 ]; then
            echo "Error: the guide points at runs/*/*-openroad-stapostpnr/*ss_*/checks.rpt,"
            echo "and nothing is there. What the flow did write:"
            find runs -name '*.rpt' 2>/dev/null | head -20
            exit 1
          fi
          # Not just present: it has to be a timing report, or the guide is
          # sending the reader to the wrong file rather than to no file.
          rpt="${rpts[0]}"
          echo "--- $rpt ---"
          grep -qF "slack" "$rpt" || {
            echo "Error: $rpt names no slack -- that is not the timing report."
            exit 1
          }
          head -30 "$rpt"

          # Hold fails in the fast corner, so the guide gives a second command
          # for it. That path is documented, so it is checked too -- the run that
          # added the listing below is where its name came from.
          holds=(runs/*/*-openroad-stapostpnr/*ff_*/checks.rpt)
          if [ ${#holds[@]} -eq 0 ]; then
            echo "Error: the guide points a hold failure at"
            echo "  runs/*/*-openroad-stapostpnr/*ff_*/checks.rpt"
            echo "and nothing is there. The corners this run did produce:"
            ls -d runs/*/*-openroad-stapostpnr/*/ 2>/dev/null
            exit 1
          fi
          grep -qF "slack" "${holds[0]}" || {
            echo "Error: ${holds[0]} names no slack -- that is not the timing report."
            exit 1
          }
          echo "--- ${holds[0]} ---"
          head -10 "${holds[0]}"

          # And print every corner. The guide tells the reader these globs match
          # more than one file and that picking the worst is on them, so the
          # count here is the evidence for that sentence.
          corners=(runs/*/*-openroad-stapostpnr/*/)
          echo "--- timing corners this run produced (${#corners[@]}) ---"
          printf '%s\n' "${corners[@]}"

      # Gate-level simulation of the netlist the step above just produced.
      #
      # Push-only, and a step rather than a job: it needs that netlist, so it
      # could not run in parallel anyway, and keeping it here avoids shipping
      # the whole build/ directory through the artifact store to get at it.
      #
      # Not on pull requests. blinky's led toggles once every 2**25 cycles and
      # the netlist has no WIDTH left to shrink, so this costs ~4 minutes --
      # measured here, not guessed. Paying that on every review round trip buys
      # little: the netlist only changes when the RTL or the flow does, and
      # merging to main catches that before any tag is cut.
      #
      # Phrased as "not a pull request" rather than "is a push" so that
      # workflow_dispatch runs it too -- that is the way to exercise a branch's
      # gate-level simulation before merging it, without paying for it on every
      # review round trip.
      #
      # Skipped when config.yaml does not ask for it, for the reason the
      # cocotb step gives -- and more so here: a gate-level testbench cannot
      # reuse the RTL one's trick of shrinking the design through a parameter,
      # so it is the hardest file in this repo to write. Requiring it of
      # everyone who pushes their own design would mean red CI on their first
      # push, for a test they were never told was mandatory.
      # docs/guide.md says reset timing is unanswered here, and says whether the
      # flow checks recovery and removal at all depends on arcs in the cell
      # library. blinky is an async-reset design, the corner reports are right
      # here, and nobody has looked. Printed rather than asserted: this is how
      # the next edit to that paragraph gets a fact instead of a hedge.
      - name: What the corner reports say about reset timing
        run: |
          shopt -s nullglob
          rpts=(runs/*/*-openroad-stapostpnr/*/checks.rpt)
          echo "${#rpts[@]} corner report(s)"
          hits=$(grep -ril -e recovery -e removal "${rpts[@]}" 2>/dev/null | wc -l)
          echo "naming recovery or removal: $hits"
          if [ "$hits" -gt 0 ]; then
            grep -rih -A2 -e recovery -e removal "${rpts[@]}" | head -30
          else
            echo "None of them mention either check. Section headings present:"
            grep -rhoE '^[a-z ]+(check|checks|slack)' "${rpts[0]}" | sort -u | head -20
          fi

      - name: 5. Gate-Level Simulation
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        run: |
          if ! grep -q '^"//GATE_TESTS":' config.yaml; then
            echo "config.yaml has no //GATE_TESTS -- no gate-level testbench to run."
            exit 0
          fi
          make gatesim

      # What `make report` prints -- area, timing, power, signoff -- on the
      # run's summary page, so reading them does not mean opening the log or
      # waiting for Pages. The [INFO] lines are c4o-core saying which files it
      # read, not results, so they stay in the log.
      - name: Signoff numbers on the summary page
        run: |
          make -s report | tee build/report.txt
          {
            echo '## Signoff'
            echo '```text'
            grep -v '\[INFO\]' build/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One page with what `make report` prints, the layout, the schematic and
      # the cocotb verdicts. Built on every run, pull requests included, so a
      # change that breaks the page is caught before it reaches main.
      - name: Build the results page
        run: |
          make site
          ls -lh build/site/
          # After make gds these four come from the run's own reports. Each is
          # left out silently when its report is missing, so a LibreLane
          # upgrade that moved one would otherwise just shrink the page.
          sections=("Signoff checks" "Worst setup path" "Area" "Power")
          # Only when asked for: the README tells a student that deleting the
          # key skips the waveform, and a red run would make that a lie.
          if grep -q '^"//WAVE_SIGNALS":' config.yaml; then
            sections+=("Waveform")
          fi
          for section in "${sections[@]}"; do
            grep -qF "<h2>$section</h2>" build/site/index.html \
              || { echo "The results page has no '$section' section."; exit 1; }
          done

      # Only main is published, and only when the repository has Pages set to
      # "GitHub Actions". A copy of this template starts with Pages off, and
      # turning it on is a setting no workflow token can change -- so off is
      # a notice, not a red run. An answer that is neither yes nor no fails,
      # because a silently unpublished page is the failure this step exists
      # to rule out. README, "Publishing the results page".
      - name: Is GitHub Pages set to publish from Actions?
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$code" in
            200)
              build_type=$(python3 -c "import json; print(json.load(open('pages.json')).get('build_type'))")
              if [ "$build_type" = workflow ]; then
                echo "publish=true" >> "$GITHUB_OUTPUT"
              else
                echo "::notice::GitHub Pages publishes from a branch here (build_type: $build_type), so the results page was not published. Settings > Pages > Source: GitHub Actions publishes it."
              fi ;;
            404)
              echo "::notice::GitHub Pages is off for this repository, so the results page was not published. Settings > Pages > Source: GitHub Actions turns it on." ;;
            *)
              echo "Asking GitHub whether Pages is on returned HTTP $code:"
              cat pages.json
              exit 1 ;;
          esac

      - name: Upload the results page
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      # The schematic on its own, for the same reason the layout render gets
      # one below: it is a small file people actually want to open, and it is
      # otherwise only inside the ~10MB bundle. Its existence is already
      # asserted in step 3b, so 'warn' here cannot hide a missing file.
      - name: Upload the schematic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schematic
          path: build/schematic.svg
          if-no-files-found: warn
          retention-days: 5

      # The layout image on its own, because the bundle below is ~10MB and
      # this is the one file in it anyone wants to look at. `report` prints
      # its path; this makes it one click from the run summary instead.
      - name: Upload the layout render
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: layout
          path: runs/*/final/render/*.png
          if-no-files-found: warn
          retention-days: 5

      # runs/ is no longer inside build/, so name both or the run itself --
      # every log, netlist and report the flow produced -- stops being kept.
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chipforall-build-artifacts
          path: |
            build/
            runs/
          retention-days: 5

      # A v* tag publishes the GDS that the steps above just verified.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # A glob, for the same reason the verify step above uses one.
          files: build/*.gds
          generate_release_notes: true

  # Publishes the page full-flow built. A job of its own because deploying to
  # Pages needs an OIDC token and the github-pages environment, and neither
  # belongs on the job that runs everything else.
  pages:
    needs: full-flow
    if: needs.full-flow.outputs.publish-pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the results page
        id: deploy
        uses: actions/deploy-pages@v5
