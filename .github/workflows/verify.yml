name: RTL to GDSII

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore here, deliberately. A required status check that never runs
  # is not "skipped". It stays "Expected", waiting for status to be reported,
  # and the pull request can never be merged. A docs-only change costs one full
  # run. A permanently unmergeable pull request costs more. The push trigger
  # above keeps its filter, so merging docs to main still skips the flow.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # A pull request that changes only what the push trigger above ignores
  # (Markdown, LICENSE, .gitignore) does not run the flow. No step below reads
  # any of those files, so a full run of it could not change a
  # verdict.
  #
  # The job decides this because of the trap described above. With
  # paths-ignore the required check never reports. Here it reports as skipped,
  # which a required check accepts. Everything is unchecked on such a pull
  # request. A pull request that touches one other file runs all of it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Does this change anything the flow reads?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          echo "$files"
          other=$(grep -vxE '.*\.md|LICENSE|\.gitignore' <<<"$files" || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "::notice::Docs only: the flow is not run for this pull request."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The Dev Container is the "zero install" promise. Nothing else here
  # exercises it. The job below runs on the host, against the plain image.
  # So a devcontainer.json change could only be caught by opening a Codespace
  # by hand. That is how `remoteUser` broke once already.
  #
  # Builds it for real. It checks two things that `make gds` needs from it.
  # One is a Docker daemon that answers (the guard's exact condition). The
  # other is the in-container delegation path that the Makefile takes when it
  # finds the entrypoint script locally. It does not run `make gds` itself.
  # That wants a multi-GB PDK and a long run. It also cannot speak for
  # Codespaces, whose remote server is a different thing again.
  devcontainer:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the Dev Container and use it
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -e
            echo "--- the daemon 'make gds' guards on ---"
            docker info > /dev/null
            docker version --format '{{.Server.Version}}'
            echo "--- the in-container delegation path ---"
            make rtl

  # Every repository made from this template shares some steps: the image and
  # PDK setup, the fast checks, the flow, the report, the uploads. They are
  # composite actions in c4o-core, called at a branch that each c4o-core
  # release moves. So a fix to one of them reaches a repository made from this
  # template without anybody copying it. What each action does:
  # https://github.com/anlit75/c4o-core/blob/main/docs/actions.md
  #
  # Steps of your own go between the actions. They run in this job, so they
  # read runs/ and build/ directly.
  full-flow:
    needs: changes
    # Runs unless the job above said no. If that job fails, its output is
    # empty and this still runs. A broken decision must not look like a pass.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read  # only to ask whether Pages is on
    outputs:
      publish-pages: ${{ steps.report.outputs.publish-pages }}
    env:
      # 'true' in the template itself, and not in a repository made from it.
      IS_TEMPLATE: ${{ github.event.repository.is_template }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: anlit75/c4o-core/actions/setup@v2

      # The steps marked "Template only" check sentences in this template's own
      # README and guide. They run when this repository is the template. They are
      # skipped in a repository made from it, where those sentences are no
      # longer the documentation. Delete them there if you like.
      #
      # Whether they run comes from the event that started the workflow. This
      # step asks the API the same question. Its purpose: if the two ever
      # disagree, the template's checks do not just stop running with every step
      # green.
      - name: The template's own checks are on where they should be
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.is_template')
          echo "the event says is_template='$IS_TEMPLATE', the API says '$api'"
          if [ "$api" = true ] && [ "$IS_TEMPLATE" != true ]; then
            echo "::error::This repository is a template, and the steps marked 'Template only' are switched off. They read github.event.repository.is_template."
            exit 1
          fi
          if [ "$api" != true ] && [ "$IS_TEMPLATE" = true ]; then
            echo "::error::This repository is not a template, and the steps marked 'Template only' are switched on."
            exit 1
          fi

      # Template only.
      # This template's Makefile is the stub that c4o-core ships, so that a copy
      # made from it starts with a stub that works with the image. The commands
      # are in the image, and the stub is what finds them. A stub edited by hand,
      # or one left over from an older image, would make a new repository fail
      # before its first command.
      #
      # So compare two stubs. One is the stub in the
      # Makefile, from its marker line to the include line. The other is the stub
      # in the image it names.
      - name: The Makefile is still the stub the image ships
        if: env.IS_TEMPLATE == 'true'
        run: |
          image=$(grep -E '^C4O_IMAGE :=' Makefile | sed 's/.*:= *//')
          marker='# --- From here down this file is c4o-core'"'"'s stub.mk. Do not edit it. ---'
          if ! grep -qxF "$marker" Makefile; then
            echo "::error::The Makefile has no line '$marker'. The stub must start with that line, and the stub must not be edited."
            exit 1
          fi
          work=$(mktemp -d)
          awk -v m="$marker" '$0 == m { p = 1 } p { print } p && $0 == "include $(C4O_RULES)" { exit }' Makefile > "$work/makefile-stub"
          docker run --rm --entrypoint cat "$image" /opt/c4o-core/stub.mk > "$work/image-stub"
          if ! diff -u "$work/image-stub" "$work/makefile-stub"; then
            echo "::error::The stub in the Makefile differs from the stub in $image. The stub must not be edited. Copy stub.mk from that image again."
            exit 1
          fi
          echo "  the Makefile's stub is the one in $image"

      # Template only.
      # README tells anyone on an Apple Silicon machine that `make gds` runs
      # native, because LibreLane publishes arm64. That is a fact about
      # somebody else's registry. If they stop publishing it, or the pinned tag
      # moves, that paragraph is wrong with nothing failing. Ask the registry.
      # It needs no arm64 runner: a manifest index lists its platforms.
      - name: The arm64 image the README promises is still published
        if: env.IS_TEMPLATE == 'true'
        run: |
          image=$(grep -E '^LIBRELANE_IMAGE :=' Makefile | sed 's/.*:= *//')
          repo=${image%:*}; repo=${repo#ghcr.io/}; tag=${image##*:}
          token=$(curl -sS "https://ghcr.io/token?scope=repository:$repo:pull&service=ghcr.io" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          platforms=$(curl -sS -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$tag" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for m in d.get('manifests', []):
              p = m.get('platform', {})
              print(p.get('os', '?') + '/' + p.get('architecture', '?'))
          ")
          echo "$image publishes:"
          echo "${platforms:-  (a single manifest, no platform list)}"
          if ! grep -qx 'linux/arm64' <<<"$platforms"; then
            echo "::error::README says make gds runs native on arm64 because $image is published for it. It is not."
            exit 1
          fi

      # Template only.
      # README tells a reader that SystemVerilog works in every command from
      # c4o-core 2.8.3 on. `make sim` is the one that used to reject it. So run
      # the pinned image against a file that needs it. This step writes that file
      # rather than shipping it in the template. The claim is about the image, not
      # about the example, and the template stays a Verilog one.
      - name: SystemVerilog reads, as the README says it does
        if: env.IS_TEMPLATE == 'true'
        run: |
          image=$(grep -E '^C4O_IMAGE :=' Makefile | sed 's/.*:= *//')
          work=$(mktemp -d)
          python3 - "$work" <<'PY'
          import os, sys, textwrap
          work = sys.argv[1]
          os.makedirs(f"{work}/rtl", exist_ok=True)
          os.makedirs(f"{work}/tb", exist_ok=True)
          open(f"{work}/rtl/sv.sv", "w").write(textwrap.dedent("""\
              module sv (input logic clk, input logic rst, output logic q);
                always_ff @(posedge clk or posedge rst) q <= rst ? 1'b0 : ~q;
              endmodule
              """))
          open(f"{work}/tb/sv_tb.v", "w").write(textwrap.dedent("""\
              `timescale 1ns/1ps
              module sv_tb;
                reg clk = 0, rst = 1; wire q;
                sv dut (.clk(clk), .rst(rst), .q(q));
                always #5 clk = ~clk;
                initial begin #12 rst = 0; #40 $display("ok q=%b", q); $finish; end
              endmodule
              """))
          open(f"{work}/config.yaml", "w").write(textwrap.dedent("""\
              DESIGN_NAME: sv
              VERILOG_FILES:
                - dir::rtl/sv.sv
              "//TEST_FILES":
                - dir::tb/sv_tb.v
              """))
          PY
          docker run --rm -v "$work:/workspace" -w /workspace \
            -u "$(id -u):$(id -g)" "$image" sim
          echo "  sim accepted always_ff and logic"

      # The config check, compile, lint and synthesis, the Verilog testbench and
      # the Python (cocotb) testbenches when config.yaml asks for them, and the
      # schematic.
      - name: Fast checks
        uses: anlit75/c4o-core/actions/checks@v2

      # Template only.
      # README's quick start has the reader change count[WIDTH-1] to
      # count[WIDTH-2] in rtl/blinky.v. The reader runs `make sim` and sees it stop
      # on a line that the README quotes word for word.
      #
      # Make that edit here. Check
      # that the run still fails, and fails with that line. The line is read from
      # README.md, so the two cannot drift apart. This runs only while rtl/blinky.v
      # is the example that the README describes. A copy of this template with its
      # own design has nothing to break this way, and must not go red for it.
      #
      # The broken run rewrites build/ with its own cocotb verdict,
      # which the results page reads. build/ is put back afterwards.
      - name: The bug the README breaks on purpose is caught
        if: env.IS_TEMPLATE == 'true'
        run: |
          if ! grep -qF 'count[WIDTH-1]' rtl/blinky.v 2>/dev/null; then
            echo "::notice::rtl/blinky.v is not the README's example; nothing to break."
            exit 0
          fi
          expected=$(grep -m1 -F '[ERROR] cocotb tests failed:' README.md || true)
          if [ -z "$expected" ]; then
            echo "::error::README.md quotes no '[ERROR] cocotb tests failed:' line for the broken rtl/blinky.v."
            exit 1
          fi
          log="$RUNNER_TEMP/break.log"
          rm -rf "$RUNNER_TEMP/build.kept"
          cp -a build "$RUNNER_TEMP/build.kept"
          sed -i 's/count\[WIDTH-1\]/count[WIDTH-2]/' rtl/blinky.v
          status=0
          make sim > "$log" 2>&1 || status=$?
          git checkout -- rtl/blinky.v
          rm -rf build
          cp -a "$RUNNER_TEMP/build.kept" build
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error::README says breaking rtl/blinky.v makes make sim fail. It passed."
            exit 1
          fi
          if ! grep -qF "$expected" "$log"; then
            echo "::error::README quotes '$expected' for the broken rtl/blinky.v. make sim did not print it."
            exit 1
          fi
          echo "  make sim failed with the line the README quotes"

      # `make gds`, after the LibreLane image the setup step started pulling.
      - name: Physical design
        uses: anlit75/c4o-core/actions/gds@v2

      # Template only.
      # docs/guide.md tells a reader they can bring their own timing constraints
      # by setting PNR_SDC_FILE and SIGNOFF_SDC_FILE. Those are LibreLane's
      # variables, not this repository's. Nothing here would notice if an
      # upgrade renamed or dropped them. The guide would go on telling
      # people to set keys that do nothing.
      #
      # So ask the pinned image itself. This
      # asserts the keys exist, not that a given SDC file is read. Only a run
      # with one in it can say that.
      - name: The SDC keys the guide documents exist in this LibreLane
        if: env.IS_TEMPLATE == 'true'
        run: |
          image=$(grep -E '^LIBRELANE_IMAGE :=' Makefile | sed 's/.*:= *//')
          echo "Asking $image which SDC variables it declares:"
          declared=$(docker run --rm "$image" python3 -c "
          import librelane, pathlib
          src = (pathlib.Path(librelane.__file__).parent / 'steps' / 'openroad.py').read_text()
          for key in ('PNR_SDC_FILE', 'SIGNOFF_SDC_FILE'):
              if '\"%s\"' % key in src:
                  print(key)
          ")
          for key in PNR_SDC_FILE SIGNOFF_SDC_FILE; do
            if ! grep -qx "$key" <<<"$declared"; then
              echo "Error: docs/guide.md documents $key, and $image does not declare it."
              echo "What it does declare:"
              echo "${declared:-(nothing)}"
              exit 1
            fi
            echo "  $key ok"
          done

      # Template only.
      # docs/guide.zh-TW.md tells a reader with negative slack to cat this exact
      # glob. The path it used to give (runs/*/final/*.rpt) matched nothing,
      # and the reader who needed it most got silence back. A documented path
      # that nothing checks is a path that rots, so check it here.
      - name: The timing report the guide tells you to read is where it says
        if: env.IS_TEMPLATE == 'true'
        run: |
          shopt -s nullglob
          rpts=(runs/*/*-openroad-stapostpnr/*ss_*/checks.rpt)
          if [ ${#rpts[@]} -eq 0 ]; then
            echo "Error: the guide points at runs/*/*-openroad-stapostpnr/*ss_*/checks.rpt,"
            echo "and nothing is there. What the flow did write:"
            find runs -name '*.rpt' 2>/dev/null | head -20
            exit 1
          fi
          # Not just present: it has to be a timing report. Otherwise the guide sends
          # the reader to the wrong file rather than to no file.
          rpt="${rpts[0]}"
          echo "--- $rpt ---"
          grep -qF "slack" "$rpt" || {
            echo "Error: $rpt names no slack -- that is not the timing report."
            exit 1
          }
          head -30 "$rpt"

          # Hold fails in the fast corner, so the guide gives a second command
          # for it. That path is documented, so it is checked too. The run that
          # added the listing below is where its name came from.
          holds=(runs/*/*-openroad-stapostpnr/*ff_*/checks.rpt)
          if [ ${#holds[@]} -eq 0 ]; then
            echo "Error: the guide points a hold failure at"
            echo "  runs/*/*-openroad-stapostpnr/*ff_*/checks.rpt"
            echo "and nothing is there. The corners this run did produce:"
            ls -d runs/*/*-openroad-stapostpnr/*/ 2>/dev/null
            exit 1
          fi
          grep -qF "slack" "${holds[0]}" || {
            echo "Error: ${holds[0]} names no slack -- that is not the timing report."
            exit 1
          }
          echo "--- ${holds[0]} ---"
          head -10 "${holds[0]}"

          # And print every corner. The guide tells the reader that these globs match
          # more than one file. It also says that picking the worst is up to the reader.
          # So the count here is the evidence for that sentence.
          corners=(runs/*/*-openroad-stapostpnr/*/)
          echo "--- timing corners this run produced (${#corners[@]}) ---"
          printf '%s\n' "${corners[@]}"

      # Template only.
      # docs/guide.md says reset timing is unanswered here. It also says that
      # whether the flow checks recovery and removal at all depends on arcs in the cell
      # library. blinky is an async-reset design, the corner reports are right
      # here, and nobody has looked. Printed rather than asserted: this is how
      # the next edit to that paragraph gets a fact instead of a hedge.
      - name: What the corner reports say about reset timing
        if: env.IS_TEMPLATE == 'true'
        run: |
          shopt -s nullglob
          rpts=(runs/*/*-openroad-stapostpnr/*/checks.rpt)
          echo "${#rpts[@]} corner report(s)"
          hits=$(grep -ril -e recovery -e removal "${rpts[@]}" 2>/dev/null | wc -l)
          echo "naming recovery or removal: $hits"
          if [ "$hits" -gt 0 ]; then
            grep -rih -A2 -e recovery -e removal "${rpts[@]}" | head -30
          else
            echo "None of them mention either check. Section headings present:"
            grep -rhoE '^[a-z ]+(check|checks|slack)' "${rpts[0]}" | sort -u | head -20
          fi

      # The gate-level simulation (not on pull requests), the signoff numbers
      # on the run summary, and the results page.
      - name: Report
        id: report
        uses: anlit75/c4o-core/actions/report@v2
        with:
          sections: |
            Coverage

      # Template only.
      # docs/guide.md, "Iterating without re-running the whole flow", gives one
      # command for resuming from floorplan. Nothing ran the command it used to
      # give, and it had stopped working three separate ways with every other
      # step here green. So run it. Then check what that section says:
      #   - the resume needs the state file it names
      #   - synthesis is not redone
      #   - the resumed steps are added after the old ones
      #
      # Last among the flow steps, so a failure here does not hide theirs. It is
      # also last so that the steps above read a run directory with one of each step.
      #
      # Not on pull requests, for the reason the gate-level step gives: it runs
      # the flow from floorplan a second time. The command only changes
      # when the Makefile or the LibreLane pin does. Phrased the same way, so
      # workflow_dispatch exercises it on a branch before merging.
      - name: Resuming from floorplan works, as the guide says it does
        if: env.IS_TEMPLATE == 'true' && github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          netlists=(runs/*/*-yosys-synthesis/*.nl.v)
          states=(runs/*/*-openroad-floorplan/state_in.json)
          if [ ${#netlists[@]} -ne 1 ] || [ ${#states[@]} -ne 1 ]; then
            echo "::error::Expected one synthesis step and one floorplan step under runs/ before resuming, found ${#netlists[@]} and ${#states[@]}. make gds did not start from an empty run."
            exit 1
          fi
          before=$(stat -c %Y "${netlists[0]}")

          make gds LIBRELANE_ARGS="--from OpenROAD.Floorplan --with-initial-state ${states[0]}"

          after=$(stat -c %Y "${netlists[0]}")
          synth=(runs/*/*-yosys-synthesis)
          if [ "$before" != "$after" ] || [ ${#synth[@]} -ne 1 ]; then
            echo "::error::The guide says resuming from floorplan does not redo synthesis. It was redone:"
            ls -ld --time-style=full-iso "${synth[@]}" "${netlists[0]}"
            exit 1
          fi
          floorplans=(runs/*/*-openroad-floorplan)
          if [ ${#floorplans[@]} -ne 2 ]; then
            echo "::error::The guide says the resumed steps are added after the old ones. Expected two floorplan directories, found ${#floorplans[@]}:"
            printf '  %s\n' "${floorplans[@]}"
            exit 1
          fi
          echo "  resumed from floorplan: synthesis kept, resumed steps added after the old ones"

      - name: Upload
        if: always()
        uses: anlit75/c4o-core/actions/upload@v2

  pages:
    needs: full-flow
    if: needs.full-flow.outputs.publish-pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the results page
        id: deploy
        uses: actions/deploy-pages@v5
