name: RTL to GDSII

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  full-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # --- PERFORMANCE OPTIMIZATION ---
      # Cache the ~3GB Sky130 PDK to save CI time and bandwidth.
      # Volare will automatically skip downloading if the target hash exists in this cached directory.
      - name: Cache Sky130 PDK
        id: cache-pdk
        uses: actions/cache@v5
        with:
          path: pdks
          key: sky130-pdk-${{ runner.os }}-v1
          restore-keys: |
            sky130-pdk-${{ runner.os }}-

      - name: Pull c4o-core Image
        run: docker pull ghcr.io/anlit75/c4o-core:2.0.0

      - name: 1. Lint Check
        run: make lint

      - name: 2. Simulation
        run: make sim

      - name: 3. Logic Synthesis
        run: make synth

      - name: 4. Physical Design (GDSII)
        # This step will automatically trigger 'make pdk' first
        run: make gds

      - name: Verify GDS Output
        run: |
          if [ ! -s build/blinky.gds ]; then
            echo "Error: GDS file missing or empty!"
            exit 1
          fi
          ls -lh build/blinky.gds

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chipforall-build-artifacts
          path: build/
          retention-days: 5

      # A v* tag publishes the GDS that the steps above just verified.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/blinky.gds
          generate_release_notes: true
