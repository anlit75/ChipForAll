# ChipForAll design configuration
#
# A LibreLane configuration file. The same file drives simulation and linting
# through c4o-core and the physical design flow through LibreLane, so the
# variable names are LibreLane's. Keys starting with '//' are c4o-core's:
# LibreLane ignores them. 'dir::' marks a path as relative to this directory.

# ============ what you normally change ============

DESIGN_NAME: blinky

# One line per source file, in any order. A glob does not work here: LibreLane
# checks each entry as a literal path, so `make gds` stops on `rtl/**/*.v`
# although lint and simulation accept it. The top module is DESIGN_NAME.
VERILOG_FILES:
  - dir::rtl/blinky.v

# Simulation only. Globs do work on the '//' keys.
#
# Python testbenches, run by `make sim` on the RTL and again by `make gatesim`
# on the netlist. They touch only the ports, so the same files work on both.
"//COCOTB_TESTS":
  - dir::tb/*.py

# The test list for `make regress`: which tests, over how many seeds.
"//REGRESSION": dir::tb/regression.yaml

# One line under the title of the results page (`make site`) and in its link
# preview. Replace it along with rtl/blinky.v.
"//DESCRIPTION": "A clock divider that blinks an LED: the ChipForAll example, from RTL to GDS."

CLOCK_PORT: clk
CLOCK_PERIOD: 10.0

# ============ keep these unless you know what you are doing ============

PDK: sky130A
STD_CELL_LIBRARY: sky130_fd_sc_hd

# The die sizes itself around the design: FP_CORE_UTIL is how full the core
# should be, in percent. There is deliberately no DIE_AREA. Relative sizing
# never reads it, but a leftover value fails signoff with a 1-count XOR
# difference. For a fixed die, set FP_SIZING: absolute and add DIE_AREA.
FP_CORE_UTIL: 40
FP_SIZING: relative

# Keep this key. LibreLane's blackbox stubs have no timescale, so TIMESCALEMOD
# fires once per cell. Why, and when to remove it:
# https://github.com/anlit75/c4o-core/blob/main/README.md#the-librelane-workarounds
LINTER_DISABLE_WARNINGS_BLACKBOX: [UNDRIVEN, UNUSEDSIGNAL, TIMESCALEMOD]

# Keep this key. It stops OpenROAD from picking the weakest buffers, which
# cuts max slew violations. Measurements and when to remove it:
# https://github.com/anlit75/c4o-core/blob/main/README.md#the-librelane-workarounds
EXTRA_EXCLUDED_CELLS:
  - sky130_fd_sc_hd__clkdlybuf4s*
  - sky130_fd_sc_hd__dlygate4sd*
  - sky130_fd_sc_hd__buf_1
